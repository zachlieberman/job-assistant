name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff==0.16.9
      - name: Ruff check
        run: cd backend && ruff check .

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run pytest
        run: |
          cd backend
          python -m pytest --tb=short

  frontend-lint:
    name: Frontend lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: cd frontend && npm install
      - name: ESLint
        run: cd frontend && npm run lint
      - name: TypeScript
        run: cd frontend && npm run typecheck

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: cd frontend && npm install
      - name: Run Vitest
        run: cd frontend && npm test -- --run

  frontend-build:
    name: Frontend build (public + tracker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: cd frontend && npm install
      - name: Build public portfolio bundle
        # Prerenders from a fixture instead of the live API, so CI is hermetic.
        run: cd frontend && PRERENDER_DATA_FILE=scripts/fixtures/prerender-data.json npm run build:public
      - name: Check prerendered pages
        run: |
          cd frontend/dist
          for page in index projects/index experience/index contact/index 404; do
            grep -q '<h1' "$page.html" || { echo "$page.html has no prerendered content"; exit 1; }
          done
      - name: Build tracker bundle
        run: cd frontend && npm run build:tracker
